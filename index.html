<!doctype html>
<html lang="nl" class="opstarten">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light only" />
    <meta name="description" content="App voor de wintersport van Tweeslag naar Les Deux Alpes." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tweeslag Wispo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>Tweeslag Wispo</title>
    <style>
      /* Voorkomt een wit flitsje voordat de app geladen is */
      html { background: #0d0058; }
      /*
       * Laadscherm: precies zoals het iOS-splashscreen (logo 65% van de korte kant, in het midden;
       * zie pwa-assets.config.ts, padding 0.35), zodat er bij het opstarten niets verspringt. Het
       * logo staat in de pagina zelf (geen los bestand dat nog moet laden). main.tsx laat het
       * laadscherm wegvagen zodra Home getekend is.
       */
      /*
       * Geen eigen laag voor dit grote, dekkende vlak (dus geen opacity of will-change erop): als
       * iOS daar halverwege een laag van maakt, tekent het een nog niet geschilderd stuk
       * (linksboven) heel even zwart. Daarom vervaagt de achtergrondkleur (dat is gewoon
       * hertekenen) en alleen het logo zelf met opacity.
       */
      #laden { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background-color: #0d0058; transition: background-color 0.3s ease-out; }
      #laden svg { display: block; width: min(65vw, 65vh); height: auto; transition: opacity 0.2s ease-out; }
      #laden.weg { background-color: rgba(13, 0, 88, 0); pointer-events: none; }
      #laden.weg svg { opacity: 0; }
      /*
       * Zolang het laadscherm er is: geen vallende sneeuw op Home. Elke bewegende vlok krijgt op
       * iOS een eigen laag, en die dwingt het laadscherm erboven ook in een eigen laag (met
       * hetzelfde zwarte vlak). main.tsx haalt 'opstarten' weg als het laadscherm weg is.
       */
      html.opstarten .sneeuw { display: none; }
      @media (prefers-reduced-motion: reduce) { #laden, #laden svg { transition-duration: 0.01s; } }
    </style>
  </head>
  <body>
    <div id="laden" aria-hidden="true"><!--logo--></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
