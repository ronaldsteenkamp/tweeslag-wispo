<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="App voor de wintersport van Tweeslag naar Les Deux Alpes." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tweeslag Wispo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>Tweeslag Wispo</title>
    <script>
      // Thema uit Instellingen (licht, donker of de telefoon volgen) vóór het tekenen, zodat er niets omslaat.
      // Standaard licht (zelfde standaard als in screens/Instellingen.tsx).
      var t = 'licht'
      try {
        t = JSON.parse(localStorage.getItem('tweeslag-wispo.thema') || '"licht"')
      } catch (e) {}
      if (t === 'licht' || t === 'donker') document.documentElement.dataset.thema = t
    </script>
    <style>
      /* Voorkomt een wit flitsje voordat de app geladen is */
      html { background: #0d0058; }
      /*
       * Laadscherm: precies zoals het iOS-splashscreen (logo 65% van de korte kant, in het midden;
       * zie pwa-assets.config.ts, padding 0.35), zodat er bij het opstarten niets verspringt. Het
       * logo staat in de pagina zelf (geen los bestand dat nog moet laden). main.tsx laat het
       * laadscherm wegvagen zodra Home getekend is.
       */
      /*
       * will-change: meteen een eigen laag. Anders maakt iOS die pas bij het begin van het vervagen
       * aan, en tekent het een nog niet geschilderd stuk (linksboven) heel even zwart.
       */
      #laden { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #0d0058; transition: opacity 0.3s ease-out; will-change: opacity; }
      #laden svg { display: block; width: min(65vw, 65vh); height: auto; }
      #laden.weg { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { #laden { transition-duration: 0.01s; } }
    </style>
  </head>
  <body>
    <div id="laden" aria-hidden="true"><!--logo--></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
